# cargo-deny 配置（bytechainx 15 仓统一模板）
#
# 依据：
# - 组织基线 `security.md` §7 R-SEC-007（P0）：CI 运行 `cargo deny check`
# - 组织基线 `ci.md` §6：许可证白名单项目自定
# - 组织基线 `ci.md` §1：供应链 `cargo deny check` → 阻断
#
# 许可证白名单只收宽松许可（permissive）。copyleft（LGPL/AGPL/GPL）未列入：
# 15 仓的 `LGPL-2.1-or-later` / `BSL-1.0` 仅出现在 `OR` 表达式（同时提供 MIT/Apache-2.0），
# 故无需放行。

[advisories]
# 未维护依赖（unmaintained）：保持默认告警；本工作区的例外见各仓 `ignore`
# 具体项见下方按仓追加的 ignore 段
#
# 书面例外（依据组织基线 `security.md` §7 R-SEC-008：高危漏洞阻断合并，
# 除非书面例外 + 期限）：
#   RUSTSEC-2026-0543 — chrono 停维护（公告：所有版本受影响）
#     引入路径：本仓直接依赖 `chrono`（时间戳处理）
#     上游状态：公告建议迁移 jiff/time；无可用替代版本
#     复查触发：本仓完成 chrono→jiff/time 迁移时重评并解除本例外。
#     消除期限：2026-12-31（届时未消除则按 R-SEC-008 续期并重记）。
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono 停维护；本仓直接依赖，上游无安全升级（No safe upgrade available）。书面例外，待迁移 jiff/time 后解除。" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
