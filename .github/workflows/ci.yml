name: CI

# 组织 Rust 规范的 P0 门禁三件套（见仓库 AGENTS.md）：
#   cargo fmt --check / cargo clippy --all-targets -- -D warnings / cargo test
#
# 说明：
# - 不使用 `--locked`：本仓库是库，`Cargo.lock` 不入库（由下游决定版本），
#   CI 每次按 Cargo.toml 解析依赖，这与发布时的行为一致。
# - `cargo test` 同时运行单元测试、集成测试与文档测试（doctest）。
# - 不依赖任何外部服务：全部用例离线运行。
# - 不设全局 `RUSTFLAGS`：`-D warnings` 只由 clippy 那一行的 `--` 参数表达，
#   避免影响依赖构建且保持与本地门禁逐字一致。

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 rustfmt 与 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
