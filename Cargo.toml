[package]
name = "taosx"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Async TDengine client over REST and native WebSocket with pooling, batching and retry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/taosx"
homepage = "https://github.com/bytechainx/taosx"
documentation = "https://docs.rs/taosx"
readme = "README.md"
keywords = ["tdengine", "taos", "time-series", "database", "async"]
categories = ["database", "asynchronous"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "LICENSE-*", "Cargo.toml"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
toml = "0.8"
tracing = "0.1"
url = "2"

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
