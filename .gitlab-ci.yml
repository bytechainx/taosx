# GitLab CI — taosx
# 由 scripts/gitlab-ci-gen.mjs 生成；判定语义见各仓 .github/workflows/ 正本。
stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'

variables:
  CARGO_TERM_COLOR: always
  MSRV: "1.88"

.rust:
  image: rust:1.88
  tags: [docker]
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/

gate:
  extends: .rust
  stage: test
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test

supply-chain:
  extends: .rust
  stage: test
  script:
    - cargo install cargo-deny --locked
    - cargo deny check

msrv:
  extends: .rust
  stage: test
  script:
    - if [ "$MSRV" != "1.88" ]; then rustup toolchain install "$MSRV" --profile minimal; fi
    - cargo +"$MSRV" check --all-features
